name: AI PR Labeler

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  label:
    name: Classify and label PR
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.draft == false }}

    steps:
      - name: Fetch trusted labeling script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${BASE_SHA}"
          git checkout FETCH_HEAD -- project/scripts/label_pr.py

      - name: Apply AI labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_CREATE_MISSING_LABELS: "true"
          AI_LABEL_PREFIXES: "ai:"
          AI_LABEL_ALLOWLIST: >-
            delta-datalayout,
            delta-ddl,
            delta-dml,
            delta-docs,
            delta-kernel,
            delta-metadata,
            delta-spark,
            delta-standalone,
            delta-table-maintenance,
            delta-uniform,
            dsv2,
            flink,
            infra,
            kernel,
            kernel-api-change,
            kernel-spark,
            oss-infra,
            uc-spark
        run: python3 project/scripts/label_pr.py
